<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">02 / 条件状态规划 → 逆动力学出价</title><desc id="desc">训练使用真实轨迹；推理按当前观测前缀重新生成计划，仅执行当前动作。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family: -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif} .title{font-size:28px;font-weight:700;fill:#0f172a} .sub{font-size:17px;fill:#475569} .label{font-size:20px;font-weight:650;fill:#0f172a} .body{font-size:17px;fill:#334155} .small{font-size:16px;fill:#475569} .edge{fill:none;stroke:#64748b;stroke-width:2.3;marker-end:url(#arrow)} </style>
<rect width="1200" height="640" rx="20" fill="#f8fafc"/>
<text x="38" y="48" class="title">02 / 条件状态规划 → 逆动力学出价</text><text x="38" y="80" class="sub">训练使用真实轨迹；推理按当前观测前缀重新生成计划，仅执行当前动作。</text><rect x="38" y="122" width="264" height="145" rx="14" fill="#fff7ed" stroke="#fdba74"/><text x="58" y="156" class="label">条件提示</text><text x="58" y="187" class="body">目标总回报 / 回报比例因子</text><text x="58" y="214" class="body">CPA 约束 / CPA 比例因子</text><text x="58" y="241" class="body">目标合规状态 = 1</text><rect x="38" y="293" width="264" height="145" rx="14" fill="#eff6ff" stroke="#93c5fd"/><text x="58" y="327" class="label">行业 + 去噪时间</text><text x="58" y="358" class="body">可训练行业向量 Embedding</text><text x="58" y="385" class="body">15% 行业丢弃 → NULL</text><text x="58" y="412" class="body">行业向量 + 时间向量</text><rect x="373" y="179" width="336" height="188" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/><text x="393" y="213" class="label">Temporal U-Net</text><text x="393" y="244" class="body">拼接条件向量并注入各残差块</text><text x="393" y="271" class="body">从高斯噪声开始多轮去噪</text><text x="393" y="298" class="body">每轮固定已观测状态前缀</text><text x="393" y="325" class="body">使用提示 CFG 与行业 CFG</text><rect x="781" y="134" width="380" height="113" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="801" y="168" class="label">状态序列计划</text><text x="801" y="199" class="body">已观测状态 + 生成的未来状态</text><text x="801" y="226" class="body">没有直接联合扩散动作序列</text><rect x="781" y="302" width="380" height="145" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/><text x="801" y="336" class="label">条件逆动力学模型</text><text x="801" y="367" class="body">历史状态 + 当前状态 + 计划后继</text><text x="801" y="394" class="body">结合回报／CPA 提示与行业</text><text x="801" y="421" class="body">输出当前出价倍率 alpha_t</text><rect x="373" y="475" width="788" height="108" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="393" y="509" class="label">执行 → 新反馈 → 重新规划</text><text x="393" y="540" class="body">bid = alpha_t × pValue；下一时刻使用实际反馈更新观测前缀</text><text x="393" y="567" class="body">一次规划覆盖整个窗口，但不等于只做一次网络前向或保证最优。</text><path class="edge" d="M302 194H373"/><path class="edge" d="M302 361H337V312H373"/><path class="edge" d="M709 245H744V193H781"/><path class="edge" d="M970 247V302"/><path class="edge" d="M970 447V475"/><path class="edge" d="M373 529H338V391H540V367"/></svg>