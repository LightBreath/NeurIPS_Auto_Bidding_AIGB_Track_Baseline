<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">01 / 官方竞价交互与 Agent 的控制范围</title><desc id="desc">每个决策时间步接收一批流量；Agent 决定出价，环境决定获胜、曝光、花费与转化。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family: -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif} .title{font-size:28px;font-weight:700;fill:#0f172a} .sub{font-size:17px;fill:#475569} .label{font-size:20px;font-weight:650;fill:#0f172a} .body{font-size:17px;fill:#334155} .small{font-size:16px;fill:#475569} .edge{fill:none;stroke:#64748b;stroke-width:2.3;marker-end:url(#arrow)} </style>
<rect width="1200" height="560" rx="20" fill="#f8fafc"/>
<text x="38" y="48" class="title">01 / 官方竞价交互与 Agent 的控制范围</text><text x="38" y="80" class="sub">每个决策时间步接收一批流量；Agent 决定出价，环境决定获胜、曝光、花费与转化。</text><rect x="38" y="120" width="258" height="144" rx="14" fill="#eff6ff" stroke="#93c5fd"/><text x="58" y="154" class="label">广告主目标</text><text x="58" y="185" class="body">预算 B</text><text x="58" y="212" class="body">目标 CPA C</text><text x="58" y="239" class="body">行业 category</text><rect x="38" y="294" width="258" height="144" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="58" y="328" class="label">当前流量与历史</text><text x="58" y="359" class="body">pValue：给定的转化概率</text><text x="58" y="386" class="body">历史出价、花费、转化</text><text x="58" y="413" class="body">剩余预算与时间</text><rect x="353" y="192" width="266" height="162" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/><text x="373" y="226" class="label">我们的出价 Agent</text><text x="373" y="257" class="body">生成当前倍率 alpha_t</text><text x="373" y="284" class="body">bid[t,j] = alpha_t × p[t,j]</text><text x="373" y="311" class="body">间接调节预算消耗节奏</text><rect x="680" y="120" width="482" height="144" rx="14" fill="#fff7ed" stroke="#fdba74"/><text x="700" y="154" class="label">官方多广告位竞价环境</text><text x="700" y="185" class="body">与其他广告主共同竞价 → 分配广告位</text><text x="700" y="212" class="body">曝光后产生花费，并可能发生转化</text><text x="700" y="239" class="body">本仓库离线回放仅使用固定历史价格门槛</text><rect x="680" y="314" width="482" height="124" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="700" y="348" class="label">环境反馈</text><text x="700" y="379" class="body">返回获胜／曝光／花费／转化</text><text x="700" y="406" class="body">更新剩余预算，进入下一个时间步</text><path class="edge" d="M296 192H324V242H353"/><path class="edge" d="M296 365H324V304H353"/><path class="edge" d="M619 272H650V192H680"/><path class="edge" d="M920 264V314"/><path class="edge" d="M680 376H650V472H167V438"/><text x="38" y="522" class="body">任务：最大化周期累计转化，同时控制总预算与 CPA；没有“必须匀速花钱”这一目标。</text></svg>