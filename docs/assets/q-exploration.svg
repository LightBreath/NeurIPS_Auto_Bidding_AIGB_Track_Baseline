<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="594" viewBox="0 0 1200 594" role="img" aria-labelledby="title desc">
<title id="title">03 / Q 估值驱动的局部动作增强</title><desc id="desc">Q 只在训练阶段提供近似回报信号；无法据此认证反事实状态或 CPA 合规。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family: -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif} .title{font-size:28px;font-weight:700;fill:#0f172a} .sub{font-size:17px;fill:#475569} .label{font-size:20px;font-weight:650;fill:#0f172a} .body{font-size:17px;fill:#334155} .small{font-size:16px;fill:#475569} .edge{fill:none;stroke:#64748b;stroke-width:2.3;marker-end:url(#arrow)} </style>
<rect width="1200" height="594" rx="20" fill="#f8fafc"/>
<text x="38" y="48" class="title">03 / Q 估值驱动的局部动作增强</text><text x="38" y="80" class="sub">Q 只在训练阶段提供近似回报信号；无法据此认证反事实状态或 CPA 合规。</text><rect x="38" y="126" width="270" height="133" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="58" y="160" class="label">真实专家轨迹</text><text x="58" y="191" class="body">观测状态、专家动作、奖励</text><text x="58" y="218" class="body">计算 Monte Carlo 未来累计回报</text><text x="58" y="245" class="body">保留干净专家监督</text><rect x="378" y="126" width="329" height="133" rx="14" fill="#eff6ff" stroke="#93c5fd"/><text x="398" y="160" class="label">训练并冻结 Q 集成</text><text x="398" y="191" class="body">3 个 MLP + bootstrap 掩码</text><text x="398" y="218" class="body">拟合行为策略的未来累计回报</text><text x="398" y="245" class="body">不使用 Bellman 自举</text><rect x="777" y="126" width="384" height="133" rx="14" fill="#fff7ed" stroke="#fdba74"/><text x="797" y="160" class="label">高斯动作候选</text><text x="797" y="191" class="body">a′ = clip(a + Gaussian noise)</text><text x="797" y="218" class="body">在原动作附近探索出价倍率</text><text x="797" y="245" class="body">噪声与动作使用相同单位</text><rect x="777" y="314" width="384" height="145" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="797" y="348" class="label">保守筛选</text><text x="797" y="379" class="body">候选最小 Q − 原动作最大 Q</text><text x="797" y="406" class="body">改进超过阈值，且分歧足够小</text><text x="797" y="433" class="body">再按配置概率接受候选</text><rect x="378" y="314" width="329" height="145" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/><text x="398" y="348" class="label">局部伪标签</text><text x="398" y="379" class="body">总回报 + 有上限的估计增量</text><text x="398" y="406" class="body">CPA 约束保留；合规标记未知</text><text x="398" y="433" class="body">只增加逆动力学辅助损失</text><rect x="38" y="314" width="270" height="145" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/><text x="58" y="348" class="label">真实状态扩散监督</text><text x="58" y="379" class="body">仅使用原始真实轨迹</text><text x="58" y="406" class="body">不改写真实后继状态</text><text x="58" y="433" class="body">不把 Q 估值当环境回报</text><path class="edge" d="M308 193H378"/><path class="edge" d="M707 193H777"/><path class="edge" d="M970 259V314"/><path class="edge" d="M777 386H707"/><path class="edge" d="M174 259V314"/><text x="38" y="525" class="body">实现目标：扩展局部动作学习范围；实际收益、CPA 与 OOD 泛化需通过独立回放实验验证。</text><text x="38" y="557" class="small">探索默认关闭。图中保守筛选是启发式估值约束，不是统计置信区间或性能保证。</text></svg>